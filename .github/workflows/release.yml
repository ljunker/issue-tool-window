name: Release

# Jeder Push auf main (Merge von develop nach main) wird getestet. Enthält er seit dem letzten Tag vX.Y.Z Commits vom Typ
# feat/fix/perf oder Breaking Changes, entsteht automatisch eine neue Version:
# Plugin signieren, im JetBrains Marketplace veröffentlichen und als GitHub-Release mit Tag ablegen.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Versionssprung (auto = aus Conventional Commits ableiten)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Test, version and publish
    # Auch ein manueller Start veröffentlicht nur von main aus.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Determine next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: .github/scripts/next-version.sh "$BUMP" build/release

      - name: Pass version and change notes to Gradle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "ORG_GRADLE_PROJECT_pluginVersion=$VERSION"
            echo "ORG_GRADLE_PROJECT_pluginChangeNotes<<CHANGE_NOTES_EOF"
            cat build/release/change-notes.html
            echo "CHANGE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      # signPlugin wird ohne CERTIFICATE_CHAIN/PRIVATE_KEY von Gradle übersprungen.
      - name: Test, build, verify and sign
        run: ./gradlew --no-daemon test buildPlugin verifyPlugin signPlugin

      - name: Publish to JetBrains Marketplace
        if: steps.version.outputs.release == 'true' && env.PUBLISH_TOKEN != ''
        run: ./gradlew --no-daemon publishPlugin

      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="build/distributions/issue-tool-window-$VERSION-signed.zip"
          [[ -f "$zip" ]] || zip="build/distributions/issue-tool-window-$VERSION.zip"
          gh release create "v$VERSION" "$zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file build/release/release-notes.md
