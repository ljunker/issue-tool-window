name: CI

# Nur Pull Requests gegen main (Release-PRs von develop) werden geprüft.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Test, build and verify plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Test, build and verify
        run: ./gradlew --no-daemon test buildPlugin verifyPlugin
